name: 'Run Tests'
description: 'Lint and test halos-docs-tools'

runs:
  using: 'composite'
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@v5

    - name: Install dependencies
      run: uv sync --locked
      shell: bash

    - name: Lint
      run: uv run ruff check src/ tests/
      shell: bash

    - name: Test
      run: uv run pytest
      shell: bash
