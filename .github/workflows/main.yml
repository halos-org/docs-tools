name: Main Branch CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-main-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release:
    uses: halos-org/shared-workflows/.github/workflows/build-release.yml@main
    with:
      package-name: halos-docs-tools
      package-description: 'Documentation checkers and the halos-i18n MkDocs plugin for HaLOS and Hat Labs documentation sites'
      build-deb: false
